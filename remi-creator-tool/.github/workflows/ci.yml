name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: remi-creator-tool

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: Remi-creator-tool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run validation checks
        run: npm run check
