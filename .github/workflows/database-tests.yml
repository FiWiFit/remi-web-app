name: Database Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  database-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: remi-creator-tool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Run database tests
        run: supabase test db
